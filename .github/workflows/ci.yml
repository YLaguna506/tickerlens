name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, test, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres for the store package's tests.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: tickerlens
          POSTGRES_PASSWORD: tickerlens
          POSTGRES_DB: tickerlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickerlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tickerlens:tickerlens@localhost:5432/tickerlens?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only exact version tags (no floating @v10).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: agents
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Docker Compose (build and start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The API needs a SEC contact at startup; CI makes no SEC requests.
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i 's/^SEC_USER_AGENT=.*/SEC_USER_AGENT=TickerLens-CI ci@tickerlens.invalid/' .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check health endpoints
        run: |
          curl --fail --silent http://localhost:8080/healthz
          curl --fail --silent http://localhost:8080/readyz
          curl --fail --silent http://localhost:8000/healthz
          curl --fail --silent http://localhost:3000/ > /dev/null
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
