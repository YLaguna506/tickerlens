# https://taskfile.dev — run `task --list` to see everything.
# Task runs commands with a built-in shell, so these work the same on Windows,
# macOS and Linux.
version: "3"

# Load API keys and settings for tasks that run on the host (e.g. `task cli`).
dotenv: [".env"]

tasks:
  default:
    cmds:
      - task --list
    silent: true

  env:
    desc: Create .env from .env.example if it does not exist
    cmds:
      - cp .env.example .env
    status:
      - test -f .env

  up:
    desc: Build and start every service, waiting until they are healthy
    deps: [env]
    preconditions:
      - sh: '! grep -q "^SEC_USER_AGENT=TickerLens you@example.com" .env'
        msg: |
          .env still has the example settings. Add your keys to .env (README, "Getting started" step 2):
            SEC_USER_AGENT  e.g. "TickerLens your@email.com"
            TIINGO_API_KEY  prices
            GEMINI_API_KEY  AI agents
          then run `task up` again.
    cmds:
      - docker compose up -d --build --wait

  watch:
    desc: Start every service and rebuild or restart them as code changes (Ctrl+C stops watching)
    deps: [env]
    cmds:
      - docker compose up --build --watch

  web:
    desc: Run the web app with instant reload at http://localhost:5173 (needs the API up)
    dir: web
    cmds:
      - npm run dev

  down:
    desc: Stop every service (data volumes are kept)
    cmds:
      - docker compose down

  reset:
    desc: Stop every service and delete Postgres data
    prompt: This deletes all local data. Continue?
    cmds:
      - docker compose down -v

  ps:
    desc: Show service status
    cmds:
      - docker compose ps

  logs:
    desc: Follow logs (e.g. `task logs -- api`)
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  cli:
    desc: Run the TickerLens CLI (e.g. `task cli -- fetch V`)
    dir: backend
    env:
      # The CLI runs on the host, so it reaches Postgres through the published
      # port instead of the `postgres` hostname used inside Docker.
      DATABASE_URL: "postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@localhost:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable"
      SCORING_CONFIG: ../config/scoring.yaml
    cmds:
      - go run ./cmd/cli {{.CLI_ARGS}}

  fixtures:
    desc: Re-record test fixtures for V, AAPL and SNOW (uses the Postgres cache)
    dir: backend
    env:
      DATABASE_URL: "postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@localhost:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable"
    cmds:
      - go run ./tools/fixturegen V AAPL SNOW

  eval:
    desc: Run the AI agent eval set against the running stack (e.g. `task eval -- V AAPL`)
    dir: agents
    cmds:
      - uv run python evals/run_evals.py {{.CLI_ARGS}}

  # --- Tests --------------------------------------------------------------
  test:
    desc: Run all tests
    cmds:
      - task: test:go
      - task: test:py
      - task: test:web

  test:go:
    desc: Run Go tests (Postgres tests run when the stack is up)
    dir: backend
    env:
      TEST_DATABASE_URL: "postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@localhost:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable"
    cmds:
      - go test ./...

  test:py:
    desc: Run Python tests
    dir: agents
    cmds:
      - uv run pytest

  test:web:
    desc: Type-check and build the web app (no unit tests yet)
    dir: web
    cmds:
      - npm run build

  # --- Lint ---------------------------------------------------------------
  lint:
    desc: Run all linters
    cmds:
      - task: lint:go
      - task: lint:py
      - task: lint:web

  lint:go:
    desc: Lint Go code (needs golangci-lint v2)
    dir: backend
    cmds:
      - golangci-lint run

  lint:py:
    desc: Lint, format-check and type-check Python code
    dir: agents
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy .

  lint:web:
    desc: Lint the web app
    dir: web
    cmds:
      - npm run lint

  # --- Setup --------------------------------------------------------------
  setup:
    desc: Install local dev dependencies for Python and the web app
    cmds:
      - task: setup:py
      - task: setup:web

  setup:py:
    dir: agents
    cmds:
      - uv sync

  setup:web:
    dir: web
    cmds:
      - npm install
