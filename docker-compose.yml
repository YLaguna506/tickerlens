name: tickerlens

# Shared settings for our own services. `.env` is optional so `docker compose up`
# works on a fresh clone (Taskfile's `up` also creates it from .env.example).
x-app-env: &app-env
  env_file:
    - path: .env
      required: false

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickerlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickerlens}
      POSTGRES_DB: ${POSTGRES_DB:-tickerlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Go API: HTTP endpoints plus the report pipeline (runs in goroutines).
  api:
    <<: *app-env
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tickerlens:tickerlens@postgres:5432/tickerlens?sslmode=disable}
      AGENTS_URL: ${AGENTS_URL:-http://agents:8000}
      SCORING_CONFIG: /config/scoring.yaml
    # Mounted, not baked into the image: edit config/scoring.yaml and restart the API.
    volumes:
      - ./config:/config:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      agents: { condition: service_healthy }
    # `docker compose watch` (task watch): Go compiles to a binary, so a code
    # change rebuilds the image; the build cache keeps that to seconds.
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - "**/*_test.go"
            - testdata/
            - cmd/cli/
            - tools/
        # The scoring config is mounted: a restart picks it up.
        - action: restart
          path: ./config

  # Python agents: stateless HTTP service the API calls for LLM analysis.
  agents:
    <<: *app-env
    build: ./agents
    ports:
      - "${AGENTS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Python needs no build: changed code and prompts are copied into the
    # running container, which restarts. New dependencies rebuild the image.
    develop:
      watch:
        - action: sync+restart
          path: ./agents/tickerlens_agents
          target: /app/tickerlens_agents
          ignore:
            - "**/__pycache__/"
        - action: sync+restart
          path: ./agents/prompts
          target: /app/prompts
        - action: rebuild
          path: ./agents/pyproject.toml
        - action: rebuild
          path: ./agents/uv.lock

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    # The container serves a production build, so a change rebuilds it
    # (about ten seconds). For instant updates use the Vite dev server
    # (`task web`, http://localhost:5173), which reloads in place.
    develop:
      watch:
        - action: rebuild
          path: ./web
          ignore:
            - node_modules/
            - dist/
            - "**/*.test.ts"
            - "**/*.test.tsx"

volumes:
  pgdata:
